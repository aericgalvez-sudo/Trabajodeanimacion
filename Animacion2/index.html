<html>

<head>
    <title>Animcación 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            min-height: 100vh;

            flex-direction: column;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        #contenedor {
            width: 400px;
            height: 200px;
            border: 1px solid black;
            position: relative;
            margin: 0 auto;
            /*centrar el contenedor*/
            overflow: hidden;
            /*oculta todo lo que contiene*/
            background-color: black;
        }

        #cuadrito {
            width: 100px;
            height: 100px;
            position: absolute;
            /*Obligatorio para mover el div*/
            top: 50px;
            left: -100px;

            animation: cuadrito 3s infinite;
            animation-timing-function: linear;
            /*define la forma de moverse*/
        }

        @keyframes cuadrito {
            from {
                left: -100px;
            }

            to {
                left: 500px;
            }
        }

        #cuadrito img {
            width: 100px;
            height: 100px;
        }

        .menu {
            text-align: center;
            margin-top: 20px;
        }

        .menu a {
            color: black;
            font-size: 30px;
            text-decoration: none;
        }

        .titulo1 {
            margin-top: 15px;
            color: black;
            font-size: 50px;

        }

        .contenedor10 {
            position: fixed;
            left: 0px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 9;
        }
    </style>
    <link rel="stylesheet" href="../styles1.css">
</head>

<body>
    <div id="menu"></div>
    <h1 class="titulo1">ANIMACION 2</h1>
    <div id="contenedor">

        <div id="cuadrito">

            <img src="img/megamanx.gif" alt="">

        </div>

    </div>
    <script src="../menu.js"></script>
    <div class="menu">
        <a href="../index.html">INICIO</a>
    </div>
</body>


</html>
